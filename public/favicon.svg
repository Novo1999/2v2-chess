<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64">
  <!-- Chesspacito: a black and a white knight squaring up on a classic board.
       Knight drawn after Cburnett's chess pieces (BSD), as in the "Classic" set. -->
  <defs>
    <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
    <g id="knight" stroke="#141414" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/>
      <path d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.04-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.99-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.99 2.5-3c1 0 1 3 1 3"/>
      <circle cx="9" cy="25.5" r="0.9" fill="currentColor" stroke="none"/>
      <ellipse cx="14.5" cy="15.5" rx="0.6" ry="1.6" transform="rotate(30 14.5 15.5)" fill="currentColor" stroke="none"/>
    </g>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="#f0d9b5"/>
    <rect width="32" height="32" fill="#b58863"/>
    <rect x="32" y="32" width="32" height="32" fill="#b58863"/>
  </g>
  <use xlink:href="#knight" href="#knight" fill="#1c1c1c" color="#f0d9b5" transform="translate(44.5 8) scale(-1 1)"/>
  <use xlink:href="#knight" href="#knight" fill="#ffffff" color="#141414" transform="translate(19.5 16)"/>
</svg>
